<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#6c5ce7">

    <title>Notes App</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="manifest"
          href="manifest.json">

</head>

<body>

    <div class="container">

        <h1>📝 Notes App</h1>

        <div class="form">

            <input
                type="text"
                id="judul"
                placeholder="Judul catatan">

            <textarea
                id="isi"
                placeholder="Tulis catatan..."
                rows="6">
            </textarea>

            <button onclick="simpanCatatan()">
                Simpan Catatan
            </button>

        </div>

        <h2>Daftar Catatan</h2>

        <div id="daftarCatatan"></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
